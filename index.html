<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music TV Live</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:sans-serif;
}

video{
width:100%;
height:100vh;
object-fit:contain;
background:black;
}

#clock{
position:absolute;
top:10px;
right:15px;
font-size:18px;
background:rgba(0,0,0,0.5);
padding:5px 10px;
border-radius:5px;
}

#fullscreen{
position:absolute;
bottom:20px;
right:20px;
background:red;
color:white;
border:none;
padding:10px 15px;
font-size:16px;
border-radius:5px;
}

</style>
</head>

<body>

<div id="clock"></div>

<video id="player" autoplay controls></video>

<button id="fullscreen">Fullscreen</button>

<script>

var playlist=[

{
url:"https://ia600407.us.archive.org/5/items/sab-kuchh-bhula-diya-lyrical-video-hum-tumhare-hain-sanam-sonu-n-sapna-a-shahrukh-khan-madhuri-d/Sab%20Kuchh%20Bhula%20Diya%20Lyrical%20Video%20_%20Hum%20Tumhare%20Hain%20Sanam%20_%20Sonu%20N%2CSapna%20A_Shahrukh%20Khan%2CMadhuri%20D.mp4",
duration:476
},

{
url:"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain_%20%28%20With%20Lyrics%29%20Full%20Song%20Dabangg%20_%20Salman%20Khan%28720p%29.mp4",
duration:358
}

];

var player=document.getElementById("player");

function syncTV(){

var total=0;

playlist.forEach(v=>{
total+=v.duration
})

var now=Math.floor(Date.now()/1000)

var time=now%total

var index=0

while(time>=playlist[index].duration){

time-=playlist[index].duration
index++

}

player.src=playlist[index].url

player.onloadedmetadata=function(){

player.currentTime=time
player.play()

}

}

syncTV()

player.onended=function(){

syncTV()

}

setInterval(syncTV,20000)

function updateClock(){

var now=new Date()

var h=now.getHours().toString().padStart(2,"0")
var m=now.getMinutes().toString().padStart(2,"0")
var s=now.getSeconds().toString().padStart(2,"0")

document.getElementById("clock").innerText=h+":"+m+":"+s

}

setInterval(updateClock,1000)

document.getElementById("fullscreen").onclick=function(){

var video=document.getElementById("player")

if(video.requestFullscreen){
video.requestFullscreen()
}

}

</script>

</body>
</html>
