<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro TV Player AC24</title>

<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet"/>

<style>
body { margin:0; background:#000; font-family:sans-serif; overflow:hidden; display:flex; flex-direction:column; height:100vh; }

#player-container {
  flex: 0 0 60%; /* ভিডিও উপরে 60% স্ক্রিন */
  width:100%;
  position:relative;
}

#player { width:100%; height:100%; }

#logo {
  position:fixed; /* fixed makes it stay on fullscreen */
  top:10px;
  left:15px;
  font-size:22px;
  color:red;
  font-weight:bold;
  z-index:10000;
}

#clock {
  position:fixed; /* fixed makes it stay on fullscreen */
  top:10px;
  right:15px;
  font-size:18px;
  color:#fff;
  z-index:10000;
}

#playlist-container {
  flex: 1 1 auto;
  width:100%;
  max-height:40%;
  overflow:auto;
  background:rgba(0,0,0,0.9);
  z-index:9000;
}

.item { padding:12px; border-bottom:1px solid #333; color:#fff; cursor:pointer; }
.active { background:#222; }

#channelName {
  position:fixed;
  bottom:50%;
  left:20px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:5px;
  color:#fff;
  z-index:10000;
  opacity:0;
}
.show { opacity:1; transition:0.3s; }
</style>
</head>
<body>

<div id="player-container">
  <video id="player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline webkit-playsinline></video>
  <div id="logo">Hit's SultaN</div>
  <div id="clock"></div>
  <div id="channelName"></div>
</div>

<div id="playlist-container">
  <div id="playlist"></div>
</div>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls@5.15.0/dist/videojs-contrib-hls.min.js"></script>

<script>
const channels = [
{ name:"RAKKHOSH Trailer", url:"https://ia601904.us.archive.org/5/items/real-energy-production-rakkhosh-official-trailer-siam-susmita-eid-ul-fitr-2026-r/Real%20Energy%20Production%20-%20RAKKHOSH%20%EF%BD%9C%20%E0%A6%95%E0%A7%8B%E0%A6%AA%20%E0%A6%B6%E0%A7%81%E0%A6%B0%E0%A7%81%20%EF%BD%9C%20OFFICIAL%20TRAILER%20%EF%BD%9C%20SIAM%20%EF%BD%9C%20SUSMITA%20%EF%BD%9C%20EID%20UL%20FITR%202026%20%EF%BD%9C%20REAL%20ENERGY%20PRODUCTION%20.webm" },
{ name:"Tere Mast Mast Do Nain", url:"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain_%20%28%20With%20Lyrics%29%20Full%20Song%20Dabangg%20_%20Salman%20Khan%28720p%29.mp4" },
{ name:"Kotha Koiyo Na", url:"https://ia600706.us.archive.org/4/items/kotha-koiyo-na-coke-studio-bangla-season-2-shiblu-mredha-x-aleya-begum-x-emon-chowdhury/Kotha%20Koiyo%20Na%20_%20Coke%20Studio%20Bangla%20_%20Season%202%20_%20Shiblu%20Mredha%20X%20Aleya%20Begum%20X%20Emon%20Chowdhury.mp4" },
{ name:"Bonolota Express", url:"https://ia601400.us.archive.org/16/items/hoichoi-bangladesh-official-trailer-bonolota-express-mosharraf-k-chanchal-c-in-t_202603/Hoichoi%20Bangladesh%20-%20Official%20Trailer%20-%20Bonolota%20Express%20%EF%BD%9C%20Mosharraf%20K%20%EF%BD%9C%20Chanchal%20C%20%EF%BD%9C%20In%20Theatres%20this%20Eid-Ul-Fitr.mp4" },
{ name:"Woh 7 Din", url:"https://dn710200.ca.archive.org/0/items/woh-7-din-1983-1-cd-xvi-d-dvdrip.by-kunal/Woh_7_Din_1983__1CD_XViD_DVDRip.by-Kunal.mp4" }
];

const player = videojs('player', { fluid:true, autoplay:false, controls:true, preload:'auto' });

const playlist = document.getElementById('playlist');
const nameBox = document.getElementById('channelName');
let index=0;

// Build playlist
channels.forEach((c,i)=>{
  const div = document.createElement('div');
  div.className='item';
  div.innerText=c.name;
  div.onclick=()=>play(i);
  playlist.appendChild(div);
});

// Play function
function play(i){
  index=i;
  player.src({ src: channels[i].url, type: channels[i].url.includes(".m3u8") ? "application/x-mpegURL":"video/mp4" });
  player.play();
  highlight();
  showName(channels[i].name);
}

// Highlight active
function highlight(){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  playlist.children[index].classList.add('active');
}

// Show channel name
function showName(name){
  nameBox.innerText=name;
  nameBox.classList.add('show');
  setTimeout(()=>nameBox.classList.remove('show'),3000);
}

// Auto next video
player.on('ended',()=>{ index=(index+1)%channels.length; play(index); });

// Clock AM/PM
function updateClock(){
  const now=new Date();
  let h=now.getHours();
  let m=now.getMinutes();
  const ampm=h>=12?'PM':'AM';
  h=h%12||12;
  if(m<10)m='0'+m;
  document.getElementById('clock').innerText=h+':'+m+' '+ampm;
}
setInterval(updateClock,1000);
updateClock();

// Start first video
play(0);

// Double-tap seek 10 sec
let lastTap = 0;
document.getElementById('player').addEventListener('touchend', function(e){
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTap;
  const x = e.changedTouches[0].clientX;
  const w = window.innerWidth;
  if(tapLength < 300){
    if(x < w/2) player.currentTime(player.currentTime()-10);
    else player.currentTime(player.currentTime()+10);
  }
  lastTap = currentTime;
});

// Tap player to toggle playlist (fullscreen না থাকলে)
document.getElementById('player-container').addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    playlist.classList.toggle('hidden');
  }
});
</script>

</body>
</html>
