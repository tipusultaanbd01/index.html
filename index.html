<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music TV</title>

<style>
body{
margin:0;
background:black;
font-family:sans-serif;
}

video{
width:100%;
height:100vh;
object-fit:contain;
background:black;
}

#clock{
position:absolute;
top:10px;
right:15px;
color:white;
background:rgba(0,0,0,0.6);
padding:6px 10px;
border-radius:5px;
font-size:18px;
}
</style>
</head>

<body>

<div id="clock"></div>

<video id="player" autoplay controls></video>

<script>

var playlist=[
"https://ia600407.us.archive.org/5/items/sab-kuchh-bhula-diya-lyrical-video-hum-tumhare-hain-sanam-sonu-n-sapna-a-shahrukh-khan-madhuri-d/Sab%20Kuchh%20Bhula%20Diya%20Lyrical%20Video%20_%20Hum%20Tumhare%20Hain%20Sanam%20_%20Sonu%20N%2CSapna%20A_Shahrukh%20Khan%2CMadhuri%20D.mp4",
"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain_%20%28%20With%20Lyrics%29%20Full%20Song%20Dabangg%20_%20Salman%20Khan%28720p%29.mp4"
];

var player=document.getElementById("player");

var index=0;

var preloadVideo=document.createElement("video");

function startVideo(){

player.src=playlist[index];
player.play();

var next=index+1;

if(next>=playlist.length){
next=0;
}

preloadVideo.src=playlist[next];

}

startVideo();

player.addEventListener("ended",function(){

index++;

if(index>=playlist.length){
index=0;
}

player.src=playlist[index];
player.play();

var next=index+1;

if(next>=playlist.length){
next=0;
}

preloadVideo.src=playlist[next];

});

function updateClock(){

var now=new Date();

var h=String(now.getHours()).padStart(2,"0");
var m=String(now.getMinutes()).padStart(2,"0");
var s=String(now.getSeconds()).padStart(2,"0");

document.getElementById("clock").innerHTML=h+":"+m+":"+s;

}

setInterval(updateClock,1000);

</script>

</body>
</html>
</script>

</body>
</html>
