<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#000;
overflow:hidden;
font-family:sans-serif;
}

video{
width:100%;
height:100vh;
object-fit:contain;
background:#000;
transition:opacity .4s;
}

#logo{
position:fixed;
top:10px;
left:15px;
color:#00ffe5;
font-size:26px;
font-weight:bold;
background:rgba(0,0,0,0.6);
padding:6px 12px;
border-radius:6px;
z-index:10;
}

#clock{
position:fixed;
top:10px;
right:15px;
color:white;
font-size:22px;
background:rgba(0,0,0,0.6);
padding:6px 12px;
border-radius:6px;
z-index:10;
}

#infoBox{
position:fixed;
bottom:20px;
left:15px;
color:white;
background:rgba(0,0,0,0.6);
padding:10px 15px;
border-radius:8px;
z-index:10;
}

#next{color:#00ffe5;font-size:15px;margin-top:5px;}
#after{color:#ffaa00;font-size:14px;margin-top:3px;}

#loader{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
border:6px solid #333;
border-top:6px solid white;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(360deg)}
}

</style>
</head>

<body>

<div id="logo">Boom TV</div>
<div id="clock"></div>

<div id="infoBox">
<div id="now"></div>
<div id="next"></div>
<div id="after"></div>
</div>

<div id="loader"></div>

<video id="player" autoplay playsinline></video>

<script>

const videos=[

{
name:"Rakkhosh Trailer",
src:"https://ia601904.us.archive.org/5/items/real-energy-production-rakkhosh-official-trailer-siam-susmita-eid-ul-fitr-2026-r/Real%20Energy%20Production%20-%20RAKKHOSH%20.webm",
duration:130
},

{
name:"Tere Mast Mast Do Nain",
src:"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain.mp4",
duration:240
},

{
name:"Bonolota Express Trailer",
src:"https://ia601400.us.archive.org/16/items/hoichoi-bangladesh-official-trailer-bonolota-express-mosharraf-k-chanchal-c-in-t_202603/Hoichoi%20Bangladesh%20-%20Official%20Trailer.mp4",
duration:90
},

{
name:"Kotha Koiyo Na",
src:"https://ia600706.us.archive.org/4/items/kotha-koiyo-na-coke-studio-bangla-season-2-shiblu-mredha-x-aleya-begum-x-emon-chowdhury/Kotha%20Koiyo%20Na.mp4",
duration:347
},

{
name:"Bhober Deshe Thako Konna",
src:"https://ia600406.us.archive.org/27/items/animes-roy-bhaber-deshe-thako-konna-bari-siddiqui-animes-roy/Animes%20Roy.webm",
duration:295
}

]

const player=document.getElementById("player")

let totalDuration=0
videos.forEach(v=> totalDuration+=v.duration)

let currentIndex=-1

function startChannel(){

let now=Math.floor(Date.now()/1000)
let position=now%totalDuration

let index=0
let time=position

for(let i=0;i<videos.length;i++){
if(time<videos[i].duration){
index=i
break
}
time-=videos[i].duration
}

if(index!==currentIndex){

currentIndex=index

let next=(index+1)%videos.length
let after=(index+2)%videos.length

document.getElementById("now").innerText="Now Playing: "+videos[index].name
document.getElementById("next").innerText="Next: "+videos[next].name
document.getElementById("after").innerText="After: "+videos[after].name

player.style.opacity=0

setTimeout(()=>{

player.src=videos[index].src
document.getElementById("loader").style.display="block"

player.onloadedmetadata=function(){

player.currentTime=time
player.play()

setTimeout(()=>{
player.style.opacity=1
document.getElementById("loader").style.display="none"
},200)

}

},300)

}

}

startChannel()
setInterval(startChannel,15000)

/* Clock */

function updateClock(){
const now=new Date()
let h=now.getHours()
let m=now.getMinutes()
let s=now.getSeconds()

if(h<10) h="0"+h
if(m<10) m="0"+m
if(s<10) s="0"+s

document.getElementById("clock").innerText=h+":"+m+":"+s
}

setInterval(updateClock,1000)
updateClock()

/* fullscreen */

document.body.onclick=function(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen()
}
}

</script>

</body>
</html>
