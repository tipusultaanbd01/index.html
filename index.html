<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>°ভান্ডারি টিভি°</title>

<!-- Video.js -->
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

/* Player Fullscreen */
.video-js{
  width:100%;
  height:100vh;
}

/* Channel Name */
#channelName{
  position:absolute;
  top:15px;
  left:15px;
  background:red;
  padding:6px 12px;
  font-size:16px;
  font-weight:bold;
  border-radius:5px;
  z-index:999;
}

/* Clock */
#clock{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  padding:6px 12px;
  font-size:16px;
  border-radius:5px;
  z-index:999;
}
</style>
</head>

<body>

<div id="channelName">°ভান্ডারি টিভি°</div>
<div id="clock"></div>

<video id="player" class="video-js vjs-default-skin" controls autoplay muted playsinline></video>

<script>
const videos = [
  "http://103.225.94.27/Infobase/hdd-3/hindi/Mardaani%203%20(2026)%201080p%20DVDRip.mp4",
  "http://103.225.94.27/Infobase/hdd-3/hindi/Border%202%20(2026)%20Hindi%20720p%20HDTS%20x264%20%5bDDN%5d.mp4",
  "http://103.225.94.27/Infobase/hdd-2/Bangla/Antarjal%20(2023)%201080p%20WEBDL.mp4"
];

const player = videojs('player', {
  autoplay: true,
  controls: true,
  preload: 'auto'
});

// ⏱️ Live Sync
function getCurrentVideo() {
  const now = Math.floor(Date.now() / 1000);
  const duration = 3600;
  const index = Math.floor(now / duration) % videos.length;
  const startTime = now % duration;
  return { index, startTime };
}

function playLive() {
  const data = getCurrentVideo();

  player.src({
    src: videos[data.index],
    type: "video/mp4"
  });

  player.ready(() => {
    player.currentTime(data.startTime);
    player.play();
  });

  player.on('ended', () => {
    playLive();
  });
}

// Sync Fix
setInterval(() => {
  const data = getCurrentVideo();
  if (Math.abs(player.currentTime() - data.startTime) > 5) {
    player.currentTime(data.startTime);
  }
}, 30000);

// ⏰ Clock
function updateClock(){
  const now = new Date();
  let h = String(now.getHours()).padStart(2,'0');
  let m = String(now.getMinutes()).padStart(2,'0');
  let s = String(now.getSeconds()).padStart(2,'0');

  document.getElementById("clock").innerText = h + ":" + m + ":" + s;
}

setInterval(updateClock,1000);

playLive();
updateClock();
</script>

</body>
</html>
