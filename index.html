<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TV App</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet"/>

<style>
body {margin:0;background:#000;overflow:hidden;}

#playlist {
  position:absolute;
  bottom:0;
  width:100%;
  max-height:40%;
  overflow:auto;
  background:rgba(0,0,0,0.9);
  transition:0.4s;
}

.item {
  padding:12px;
  border-bottom:1px solid #333;
  color:#fff;
}

.active {background:#222;}
.hidden {transform:translateY(100%);}

#channelName {
  position:absolute;
  bottom:45%;
  left:20px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:5px;
  color:#fff;
  opacity:0;
  transition:0.3s;
}
.show {opacity:1;}
</style>
</head>

<body>

<video id="player" class="video-js vjs-fill" controls autoplay></video>

<div id="channelName"></div>
<div id="playlist"></div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const channels = [
{
name:"RAKKHOSH Trailer",
url:"https://ia601904.us.archive.org/5/items/real-energy-production-rakkhosh-official-trailer-siam-susmita-eid-ul-fitr-2026-r/Real%20Energy%20Production%20-%20RAKKHOSH%20%EF%BD%9C%20%E0%A6%95%E0%A7%8B%E0%A6%AA%20%E0%A6%B6%E0%A7%81%E0%A6%B0%E0%A7%81%20%EF%BD%9C%20OFFICIAL%20TRAILER%20%EF%BD%9C%20SIAM%20%EF%BD%9C%20SUSMITA%20%EF%BD%9C%20EID%20UL%20FITR%202026%20%EF%BD%9C%20REAL%20ENERGY%20PRODUCTION%20.webm"
},
{
name:"Tere Mast Mast Do Nain",
url:"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain_%20%28%20With%20Lyrics%29%20Full%20Song%20Dabangg%20_%20Salman%20Khan%28720p%29.mp4"
},
{
name:"Kotha Koiyo Na",
url:"https://ia600706.us.archive.org/4/items/kotha-koiyo-na-coke-studio-bangla-season-2-shiblu-mredha-x-aleya-begum-x-emon-chowdhury/Kotha%20Koiyo%20Na%20_%20Coke%20Studio%20Bangla%20_%20Season%202%20_%20Shiblu%20Mredha%20X%20Aleya%20Begum%20X%20Emon%20Chowdhury.mp4"
},
{
name:"Bonolota Express",
url:"https://ia601400.us.archive.org/16/items/hoichoi-bangladesh-official-trailer-bonolota-express-mosharraf-k-chanchal-c-in-t_202603/Hoichoi%20Bangladesh%20-%20Official%20Trailer%20-%20Bonolota%20Express%20%EF%BD%9C%20Mosharraf%20K%20%EF%BD%9C%20Chanchal%20C%20%EF%BD%9C%20In%20Theatres%20this%20Eid-Ul-Fitr.mp4"
},
{
name:"Woh 7 Din",
url:"https://dn710200.ca.archive.org/0/items/woh-7-din-1983-1-cd-xvi-d-dvdrip.by-kunal/Woh_7_Din_1983__1CD_XViD_DVDRip.by-Kunal.mp4"
}
];

const player = videojs('player');
const playlist = document.getElementById('playlist');
const nameBox = document.getElementById('channelName');

let index = 0;
let hideTimer;

// playlist বানানো
channels.forEach((c,i)=>{
let div = document.createElement('div');
div.className="item";
div.innerText=c.name;

div.onclick=()=>play(i);

playlist.appendChild(div);
});

// play
function play(i){
index=i;

player.src({
src: channels[i].url,
type: channels[i].url.includes(".m3u8") ? "application/x-mpegURL":"video/mp4"
});

player.play();

showName(channels[i].name);
highlight();
showPlaylist();
}

// highlight active
function highlight(){
document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
playlist.children[index].classList.add('active');
}

// channel name
function showName(name){
nameBox.innerText=name;
nameBox.classList.add("show");

setTimeout(()=>nameBox.classList.remove("show"),3000);
}

// auto next
player.on('ended',()=>{
index=(index+1)%channels.length;
play(index);
});

// remote
document.addEventListener('keydown',(e)=>{
if(e.key==="ArrowUp"){ index=(index-1+channels.length)%channels.length; play(index);}
if(e.key==="ArrowDown"){ index=(index+1)%channels.length; play(index);}
});

// swipe channel change
let startY=0;
document.addEventListener('touchstart',e=>startY=e.touches[0].clientY);
document.addEventListener('touchend',e=>{
let endY=e.changedTouches[0].clientY;

if(startY-endY>50){ index=(index+1)%channels.length; play(index);}
if(endY-startY>50){ index=(index-1+channels.length)%channels.length; play(index);}
});

// playlist show/hide
function showPlaylist(){
playlist.classList.remove("hidden");
clearTimeout(hideTimer);
hideTimer=setTimeout(()=>{
playlist.classList.add("hidden");
},180000); // 3 মিনিট
}

// screen touch = show playlist
document.addEventListener('click',()=>{
showPlaylist();
});

// start
play(0);
</script>

</body>
</html>
