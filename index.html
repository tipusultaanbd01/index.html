<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>°ভান্ডারি টিভি°</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  overflow:hidden;
}

video{
  width:100%;
  height:100vh;
  object-fit:cover;
}

/* 📺 Channel Name */
#channelName{
  position:absolute;
  top:15px;
  left:15px;
  background:red;
  padding:6px 12px;
  font-size:16px;
  font-weight:bold;
  border-radius:5px;
}

/* ⏰ Clock */
#clock{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  padding:6px 12px;
  font-size:16px;
  border-radius:5px;
}
</style>
</head>

<body>

<div id="channelName">°ভান্ডারি টিভি°</div>
<div id="clock"></div>

<video id="player" autoplay muted playsinline></video>

<script>
const videos = [
  "http://103.225.94.27/Infobase/hdd-3/hindi/Mardaani%203%20(2026)%201080p%20DVDRip.mp4",
  "http://103.225.94.27/Infobase/hdd-3/hindi/Border%202%20(2026)%20Hindi%20720p%20HDTS%20x264%20%5bDDN%5d.mp4",
  "http://103.225.94.27/Infobase/hdd-2/Bangla/Antarjal%20(2023)%201080p%20WEBDL.mp4"
];

const player = document.getElementById("player");

// ⏱️ Live Sync System
function getCurrentVideo() {
  const now = Math.floor(Date.now() / 1000);
  const duration = 3600;

  const index = Math.floor(now / duration) % videos.length;
  const startTime = now % duration;

  return { index, startTime };
}

function playLive() {
  const data = getCurrentVideo();

  player.src = videos[data.index];

  player.onloadedmetadata = () => {
    player.currentTime = data.startTime;
    player.play();
  };

  player.onended = () => {
    playLive();
  };
}

// 🔁 Auto Sync Fix
setInterval(() => {
  const data = getCurrentVideo();
  if (Math.abs(player.currentTime - data.startTime) > 5) {
    player.currentTime = data.startTime;
  }
}, 30000);

// ⏰ Clock Function
function updateClock(){
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();
  let s = now.getSeconds();

  h = h < 10 ? "0" + h : h;
  m = m < 10 ? "0" + m : m;
  s = s < 10 ? "0" + s : s;

  document.getElementById("clock").innerText = h + ":" + m + ":" + s;
}

setInterval(updateClock, 1000);

playLive();
updateClock();
</script>

</body>
</html>
