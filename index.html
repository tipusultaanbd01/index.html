/* Clock */

position:fixed;

left:15px;

font-size:22px;

<body>

<div id="clock"></div>

<video id="player" autoplay playsinline></video>

<script>

const videos=[

{
src:"https://ia600407.us.archive.org/5/items/sab-kuchh-bhula-diya-lyrical-video-hum-tumhare-hain-sanam-sonu-n-sapna-a-shahrukh-khan-madhuri-d/Sab%20Kuchh%20Bhula%20Diya%20Lyrical%20Video%20_%20Hum%20Tumhare%20Hain%20Sanam%20_%20Sonu%20N%2CSapna%20A_Shahrukh%20Khan%2CMadhuri%20D.mp4",
duration:250
},

{
src:"https://ia601502.us.archive.org/21/items/save-tube.io-tere-mast-mast-do-nain-with-lyrics-full-song-dabangg-salman-khan-720p_202603/SaveTube.io-_Tere%20Mast%20Mast%20Do%20Nain_%20%28%20With%20Lyrics%29%20Full%20Song%20Dabangg%20_%20Salman%20Khan%28720p%29.mp4",
duration:240
}

]

const player=document.getElementById("player")

let totalDuration=0

videos.forEach(v=>{
totalDuration+=v.duration
})

function startChannel(){

let now=Math.floor(Date.now()/1000)

let position=now%totalDuration

let currentVideo=0
let time=position

for(let i=0;i<videos.length;i++){

if(time<videos[i].duration){

currentVideo=i
break

}

time-=videos[i].duration

}

player.src=videos[currentVideo].src

player.onloadedmetadata=()=>{
player.currentTime=time
player.play()
}

}

startChannel()

setInterval(startChannel,30000)

/* Clock */

function updateClock(){

const now=new Date()

let h=now.getHours()
let m=now.getMinutes()
let s=now.getSeconds()

if(h<10) h="0"+h
if(m<10) m="0"+m
if(s<10) s="0"+s

document.getElementById("clock").innerText=h+":"+m+":"+s

}

setInterval(updateClock,1000)

updateClock()

</script>

await player.requestPictureInPicture()

}

</script>
