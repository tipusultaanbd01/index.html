<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>°ভান্ডারি টিভি°</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:sans-serif;
}

video{
  width:100%;
  height:100vh;
  object-fit:cover;
}

/* Logo */
#channelName{
  position:absolute;
  top:15px;
  left:15px;
  background:red;
  padding:6px 12px;
  font-weight:bold;
  border-radius:5px;
}

/* Clock */
#clock{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  padding:6px 12px;
  border-radius:5px;
}
</style>
</head>

<body>

<div id="channelName">°ভান্ডারি টিভি°</div>
<div id="clock"></div>

<video id="video" autoplay muted playsinline controls></video>

<script>
// ⚠️ এখানে তোমার m3u8 দিতে হবে
const streamURL = "YOUR_M3U8_LINK_HERE";

const video = document.getElementById('video');

if (Hls.isSupported()) {
  const hls = new Hls({
    maxBufferLength: 30,
    maxMaxBufferLength: 60
  });

  hls.loadSource(streamURL);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, function() {
    video.play();
  });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = streamURL;
  video.play();
}

// ⏰ Clock
function updateClock(){
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
